[project]
name = "inflearn-hg-mldl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "graphviz>=0.21",
    "lightgbm>=4.7.0",
    "lightning>=2.6.6",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pydot>=4.0.1",
    "scikit-learn>=1.9.1",
    "tensorflow>=2.21.0",
    "torchinfo>=1.8.0",
    "torchviz>=0.0.3",
    "xgboost>=3.4.1",
]
[project.optional-dependencies]
cpu = [
    "torch",
    "torchvision",
]
cu130 = [
    "torch",
    "torchvision",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
